<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Game MUSE · 配色参考 Demo</title>
  <style>
    /* ================================================================
       Game MUSE 妙思网站 · 配色参考 Demo
       ----------------------------------------------------------------
       使用方式：
       1. 想新增一套配色方案？只需在页面最底部 <script> 中的 PALETTES
          数组里 push 一个新对象即可，结构会自动渲染出来。
       2. 每个配色模块使用局部 CSS 变量（写在 .palette-block 的 style 里），
          因此互不影响，方便横向对比。
       ================================================================ */

    /* ---------- 全局基底（中性灰，不参与方案对比） ---------- */
    :root {
      --page-bg: #F5F5F7;
      --page-text: #1d1d1f;
      --page-muted: #6e6e73;
      --page-border: #e5e5ea;
      --page-card: #ffffff;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,.06);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--page-bg);
      color: var(--page-text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                   "Helvetica Neue", "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- 页面骨架 ---------- */
    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .page-head {
      margin-bottom: 32px;
    }
    .page-head h1 {
      font-size: 28px;
      margin: 0 0 8px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .page-head p {
      margin: 0;
      color: var(--page-muted);
      font-size: 14px;
    }
    .page-head .how-to-add {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 12px;
      background: #fff;
      border: 1px dashed var(--page-border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--page-muted);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    /* ---------- 配色模块容器 ---------- */
    #palettes-root {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .palette-block {
      background: var(--page-card);
      border: 1px solid var(--page-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    /* 模块标题区 */
    .pb-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--page-border);
    }
    .pb-head .pb-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }
    .pb-head .pb-id {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      color: var(--page-muted);
      margin-right: 8px;
    }
    .pb-head .pb-desc {
      font-size: 13px;
      color: var(--page-muted);
      max-width: 520px;
      text-align: right;
    }

    /* 模块主体：左侧色板 + 右侧 UI 样品 */
    .pb-body {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }
    @media (max-width: 880px) {
      .pb-body { grid-template-columns: 1fr; }
    }

    /* ---------- 色板（左） ---------- */
    .swatches {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .swatch {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border: 1px solid var(--page-border);
      border-radius: var(--radius-sm);
      background: #fff;
    }
    .swatch__chip {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,.08);
      flex-shrink: 0;
      /* 用棋盘格底，方便看出透明色 */
      background-image:
        linear-gradient(45deg, #eee 25%, transparent 25%),
        linear-gradient(-45deg, #eee 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eee 75%),
        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
      position: relative;
      overflow: hidden;
    }
    .swatch__chip::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--chip-color, #fff);
    }
    .swatch__meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }
    .swatch__name {
      font-size: 12px;
      color: var(--page-text);
      font-weight: 500;
    }
    .swatch__value {
      font-size: 11px;
      color: var(--page-muted);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      word-break: break-all;
    }

    /* ---------- UI 样品区（右） ---------- */
    .samples {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 通用：所有样品都坐落在「方案的页面背景」上，方便看真实观感 */
    .sample-stage {
      background: var(--bg, #fff);
      border: 1px solid var(--border, #ebebeb);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }
    .sample-stage + .sample-stage { margin-top: 0; }

    /* —— mini Header —— */
    .s-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .s-logo {
      font-weight: 800;
      font-size: 15px;
      color: var(--text, #222);
      letter-spacing: 0.5px;
    }
    .s-logo .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      /* brand 色优先用于品牌触点，未定义则回落到 accent */
      background: var(--brand, var(--accent, #FF385C));
      margin-right: 6px;
      vertical-align: middle;
    }
    .s-nav {
      display: flex;
      gap: 18px;
      font-size: 13px;
    }
    .s-nav a {
      color: var(--text-light, #6A6A6A);
      text-decoration: none;
      position: relative;
      padding-bottom: 4px;
    }
    .s-nav a.active {
      color: var(--text, #222);
      font-weight: 600;
    }
    .s-nav a.active::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -2px;
      height: 2px;
      background: var(--brand, var(--accent, #FF385C));
      border-radius: 2px;
    }
    .s-user {
      font-size: 13px;
      color: var(--text-light, #6A6A6A);
    }

    /* —— 搜索栏 + 热搜 tag —— */
    .s-search {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .s-search__input {
      flex: 1;
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid var(--border, #D9D9D9);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text-muted, #929292);
    }
    .s-search__btn {
      background: var(--accent, #FF385C);
      color: var(--text-on-accent, #fff);
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .s-search__btn:hover {
      background: var(--accent-hover, #E00B41);
    }
    .s-hot {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-light, #6A6A6A);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .s-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent-light, rgba(255, 56, 92, 0.12));
      color: var(--accent-hover, #E00B41);
      font-size: 11px;
      border: 1px solid transparent;
    }

    /* —— KPI 卡 + 案例 mini 卡 + 关注卡（三栏） —— */
    .s-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 720px) {
      .s-grid { grid-template-columns: 1fr; }
    }

    .s-kpi {
      background: var(--bg-card, #FEFAFB);
      border: 1px solid var(--border-soft, #F9EEF0);
      border-radius: var(--radius-md);
      padding: 14px;
    }
    .s-kpi__label {
      font-size: 12px;
      color: var(--text-light, #6A6A6A);
      margin-bottom: 6px;
    }
    .s-kpi__value {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent, #FF385C);
      line-height: 1.1;
    }
    .s-kpi__trend {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-muted, #929292);
    }

    .s-case {
      background: var(--bg-card, #FEFAFB);
      border: 1px solid var(--border-soft, #F9EEF0);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .s-case__cover {
      width: 56px; height: 56px;
      border-radius: 8px;
      background: repeating-linear-gradient(
        45deg,
        var(--accent-light, rgba(255,56,92,.12)),
        var(--accent-light, rgba(255,56,92,.12)) 6px,
        var(--bg-card, #FEFAFB) 6px,
        var(--bg-card, #FEFAFB) 12px
      );
      border: 1px solid var(--border-soft, #F9EEF0);
      flex-shrink: 0;
    }
    .s-case__info { min-width: 0; flex: 1; }
    .s-case__title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text, #222);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .s-case__meta {
      font-size: 11px;
      color: var(--text-muted, #929292);
      margin-top: 2px;
    }
    .s-case__badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--accent, #FF385C);
      color: var(--text-on-accent, #fff);
      font-size: 10px;
      font-weight: 600;
    }

    .s-follow {
      background: var(--bg-card, #FEFAFB);
      border: 1px solid var(--border-soft, #F9EEF0);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .s-follow__dot {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent, #FF385C);
      color: var(--text-on-accent, #fff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }
    .s-follow__info { min-width: 0; }
    .s-follow__name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text, #222);
    }
    .s-follow__update {
      font-size: 11px;
      color: var(--accent-hover, #E00B41);
      margin-top: 2px;
    }

    /* 文字色样品（一行展示三档文字 + 文字 on accent） */
    .s-text-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-size: 13px;
    }
    .s-text-row .t1 { color: var(--text, #222); font-weight: 600; }
    .s-text-row .t2 { color: var(--text-light, #6A6A6A); }
    .s-text-row .t3 { color: var(--text-muted, #929292); }
    .s-text-row .t-on {
      background: var(--accent, #FF385C);
      color: var(--text-on-accent, #fff);
      padding: 2px 10px;
      border-radius: 4px;
    }

    /* 模块小节标题 */
    .samples h4 {
      font-size: 11px;
      font-weight: 600;
      color: var(--page-muted);
      margin: 4px 0 -6px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
  </style>
</head>
<body>

<div class="page-wrap">

  <!-- ============ 页面顶部说明 ============ -->
  <header class="page-head">
    <h1>Game MUSE 妙思 · 配色参考 Demo</h1>
    <p>用于决定网站主题配色。每个模块是一套候选配色方案，包含色板和真实 UI 样品（Header / 搜索 / KPI / 案例卡 / 关注卡），可横向对比观感。</p>
    <div class="how-to-add">// 新增配色方案：在文件末尾 PALETTES 数组里 push 一项即可</div>
  </header>

  <!-- ============ 配色模块挂载点 ============ -->
  <main id="palettes-root"></main>

</div>

  /* ---------- 渲染函数 ---------- */
  function renderPalette(p) {
    const block = document.createElement('section');
    block.className = 'palette-block';

    // 把 tokens 作为 CSS 变量挂到模块根元素
    const styleStr = Object.entries(p.tokens)
      .map(([k, v]) => `${k}: ${v};`)
      .join(' ');
    block.setAttribute('style', styleStr);

    block.innerHTML = `
      <div class="pb-head">
        <h2 class="pb-title">
          <span class="pb-id">#${p.id}</span>${p.name}
        </h2>
        <div class="pb-desc">${p.desc || ''}</div>
      </div>

      <div class="pb-body">
        <!-- 左：色板 -->
        <div class="swatches">
          ${Object.entries(p.tokens).map(([k, v]) => `
            <div class="swatch">
              <div class="swatch__chip" style="--chip-color: ${v};"></div>
              <div class="swatch__meta">
                <div class="swatch__name">${k}</div>
                <div class="swatch__value">${v}</div>
              </div>
            </div>
          `).join('')}
        </div>

        <!-- 右：UI 样品 -->
        <div class="samples">

          <h4>Header · 导航</h4>
          <div class="sample-stage">
            <div class="s-header">
              <div class="s-logo"><span class="dot"></span>Game MUSE 妙思</div>
              <nav class="s-nav">
                <a href="#" class="active">首页</a>
                <a href="#">联动案例</a>
                <a href="#">主题图谱</a>
              </nav>
              <div class="s-user">👤 我的</div>
            </div>
          </div>

          <h4>搜索区 · 主按钮 · 热搜 tag</h4>
          <div class="sample-stage">
            <div class="s-search">
              <div class="s-search__input">搜索联动案例 / 游戏 / IP / 文化主题…</div>
              <button class="s-search__btn">搜索</button>
            </div>
            <div class="s-hot">
              🔥 热搜：
              <span class="s-tag">原神</span>
              <span class="s-tag">鸣潮</span>
              <span class="s-tag">明日方舟</span>
              <span class="s-tag">恋与深空</span>
            </div>
          </div>

          <h4>KPI · 案例卡 · 关注卡</h4>
          <div class="sample-stage">
            <div class="s-grid">

              <div class="s-kpi">
                <div class="s-kpi__label">2026 年新增联动</div>
                <div class="s-kpi__value">128</div>
                <div class="s-kpi__trend">↗ 本年累计</div>
              </div>

              <div class="s-case">
                <div class="s-case__cover"></div>
                <div class="s-case__info">
                  <div class="s-case__title">鸣潮 × 三星堆</div>
                  <div class="s-case__meta">库洛 · 2026-06-10</div>
                  <span class="s-case__badge">S级</span>
                </div>
              </div>

              <div class="s-follow">
                <div class="s-follow__dot">原</div>
                <div class="s-follow__info">
                  <div class="s-follow__name">原神</div>
                  <div class="s-follow__update">🆕 新联动 · 5 天前</div>
                </div>
              </div>

            </div>
          </div>

          <h4>文字层级</h4>
          <div class="sample-stage">
            <div class="s-text-row">
              <span class="t1">主文字 Text</span>
              <span class="t2">次级文字 Light</span>
              <span class="t3">辅助文字 Muted</span>
              <span class="t-on">强调底上的文字</span>
            </div>
          </div>

        </div>
      </div>
    `;

    return block;
  }

  /* ---------- 挂载 ---------- */
  const root = document.getElementById('palettes-root');
  PALETTES.forEach(p => root.appendChild(renderPalette(p)));
</script>
